<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1040" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1664FF"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22C55E"/>
    </marker>
    <marker id="arr-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#86909C"/>
    </marker>
  </defs>

  <!-- ===== 标题与图例 ===== -->
  <text x="60" y="42" font-size="22" font-weight="700" fill="#1F2329" letter-spacing="0.5">Bolt 架构总览</text>
  <text x="60" y="66" font-size="12.5" fill="#86909C">macOS · gpui-kit · QuickJS — 五层：入口 → 命令面板 → 内容模块 → 执行层 → 基础设施</text>

  <g font-size="12" fill="#4E5969">
    <line x1="1150" y1="34" x2="1190" y2="34" stroke="#1664FF" stroke-width="2.4" marker-end="url(#arr-blue)"/>
    <text x="1198" y="38">主链路 / 控制流</text>
    <line x1="1330" y1="34" x2="1370" y2="34" stroke="#F59E0B" stroke-width="2.4" marker-end="url(#arr-orange)"/>
    <text x="1378" y="38">Console 输出</text>
    <line x1="1490" y1="34" x2="1530" y2="34" stroke="#22C55E" stroke-width="2.4" marker-end="url(#arr-green)"/>
    <text x="1538" y="38">扩展目录回灌</text>
    <line x1="1150" y1="58" x2="1190" y2="58" stroke="#86909C" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr-grey)"/>
    <text x="1198" y="62">支撑依赖</text>
  </g>

  <!-- ===== 层标签（左侧 pill）===== -->
  <g>
    <rect x="60" y="88" width="130" height="34" rx="17" fill="#1664FF"/>
    <text x="125" y="110" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">① 入口</text>

    <rect x="60" y="262" width="130" height="34" rx="17" fill="#1664FF"/>
    <text x="125" y="284" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">② 命令面板</text>

    <rect x="60" y="476" width="130" height="34" rx="17" fill="#1664FF"/>
    <text x="125" y="498" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">③ 内容模块</text>

    <rect x="60" y="706" width="130" height="34" rx="17" fill="#14B8A6"/>
    <text x="125" y="728" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">④ 执行层</text>

    <rect x="60" y="920" width="130" height="34" rx="17" fill="#86909C"/>
    <text x="125" y="942" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">⑤ 基础设施</text>
  </g>

  <!-- ===== L1 入口（y 88..156）===== -->
  <g>
    <rect x="430" y="88" width="220" height="68" rx="8" fill="#FFFFFF" stroke="#E5E6EB" stroke-width="1.2"/>
    <text x="540" y="115" font-size="13.5" font-weight="600" fill="#1F2329" text-anchor="middle">全局热键</text>
    <text x="540" y="137" font-size="11.5" fill="#86909C" text-anchor="middle">Alt + Space 唤起 / 收起</text>

    <rect x="700" y="88" width="220" height="68" rx="8" fill="#FFFFFF" stroke="#E5E6EB" stroke-width="1.2"/>
    <text x="810" y="115" font-size="13.5" font-weight="600" fill="#1F2329" text-anchor="middle">Cmd+K 动作面板</text>
    <text x="810" y="137" font-size="11.5" fill="#86909C" text-anchor="middle">当前 item 的二级动作浮层</text>

    <rect x="970" y="88" width="220" height="68" rx="8" fill="#FFFFFF" stroke="#E5E6EB" stroke-width="1.2"/>
    <text x="1080" y="115" font-size="13.5" font-weight="600" fill="#1F2329" text-anchor="middle">Cmd+V 粘贴识别</text>
    <text x="1080" y="137" font-size="11.5" fill="#86909C" text-anchor="middle">类型 token · 零转码</text>
  </g>

  <!-- L1 → L2 蓝色竖直箭头 -->
  <line x1="540" y1="156" x2="540" y2="222" stroke="#1664FF" stroke-width="2.4" marker-end="url(#arr-blue)"/>
  <line x1="810" y1="156" x2="810" y2="222" stroke="#1664FF" stroke-width="2.4" marker-end="url(#arr-blue)"/>
  <line x1="1080" y1="156" x2="1080" y2="222" stroke="#1664FF" stroke-width="2.4" marker-end="url(#arr-blue)"/>

  <!-- ===== L2 Launcher 中枢（y 228..336）===== -->
  <rect x="300" y="228" width="1020" height="108" rx="10" fill="#E8F0FF" stroke="#1664FF" stroke-width="1.8"/>
  <text x="810" y="262" font-size="16" font-weight="700" fill="#0E42B5" text-anchor="middle">Launcher · 命令面板</text>
  <text x="810" y="290" font-size="12" fill="#4E5969" text-anchor="middle">搜索过滤 · smart_rank 使用频率排序 · 类型 token 过滤</text>
  <text x="810" y="312" font-size="12" fill="#4E5969" text-anchor="middle">↑↓ / Enter / Esc 键盘分流 · 悬停不选中 · 单击选中 · 双击执行 · 复合资源源 assets</text>

  <!-- L2 → L3 干线-枝线（1 → 6 扇出） -->
  <line x1="810" y1="336" x2="810" y2="384" stroke="#1664FF" stroke-width="2.4"/>
  <line x1="300" y1="384" x2="1500" y2="384" stroke="#1664FF" stroke-width="2.4"/>
  <line x1="300" y1="384" x2="300" y2="404" stroke="#1664FF" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="540" y1="384" x2="540" y2="404" stroke="#1664FF" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="780" y1="384" x2="780" y2="404" stroke="#1664FF" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="1020" y1="384" x2="1020" y2="404" stroke="#1664FF" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="1260" y1="384" x2="1260" y2="404" stroke="#1664FF" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="1500" y1="384" x2="1500" y2="404" stroke="#1664FF" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="846" y="348" width="150" height="24" rx="12" fill="#0E42B5"/>
  <text x="921" y="364" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Module 契约 · items</text>

  <!-- ===== L3 内容模块（y 410..572）===== -->
  <g>
    <rect x="200" y="410" width="200" height="162" rx="8" fill="#FFFFFF" stroke="#1664FF" stroke-width="1.4"/>
    <text x="300" y="438" font-size="13.5" font-weight="700" fill="#1F2329" text-anchor="middle">apps</text>
    <text x="300" y="458" font-size="11.5" fill="#4E5969" text-anchor="middle">应用启动器</text>
    <text x="300" y="482" font-size="11" fill="#86909C" text-anchor="middle">bundle 扫描</text>
    <text x="300" y="502" font-size="11" fill="#86909C" text-anchor="middle">图标缓存 · 别名表</text>

    <rect x="440" y="410" width="200" height="162" rx="8" fill="#FFFFFF" stroke="#1664FF" stroke-width="1.4"/>
    <text x="540" y="438" font-size="13.5" font-weight="700" fill="#1F2329" text-anchor="middle">scripts</text>
    <text x="540" y="458" font-size="11.5" fill="#4E5969" text-anchor="middle">脚本</text>
    <text x="540" y="482" font-size="11" fill="#86909C" text-anchor="middle">每脚本一条运行命令</text>
    <text x="540" y="502" font-size="11" fill="#86909C" text-anchor="middle">管理窗口 · Dock 布局</text>
    <text x="540" y="522" font-size="11" fill="#86909C" text-anchor="middle">编辑器 + Console 面板</text>

    <rect x="680" y="410" width="200" height="162" rx="8" fill="#FFFFFF" stroke="#22C55E" stroke-width="1.6"/>
    <text x="780" y="438" font-size="13.5" font-weight="700" fill="#15803D" text-anchor="middle">extensions</text>
    <text x="780" y="458" font-size="11.5" fill="#4E5969" text-anchor="middle">扩展</text>
    <text x="780" y="482" font-size="11" fill="#86909C" text-anchor="middle">清单解析 · 命令注册</text>
    <text x="780" y="502" font-size="11" fill="#86909C" text-anchor="middle">管理 / 新建窗口</text>
    <text x="780" y="522" font-size="11" fill="#86909C" text-anchor="middle">禁用 = 数据层过滤</text>

    <rect x="920" y="410" width="200" height="162" rx="8" fill="#FFFFFF" stroke="#1664FF" stroke-width="1.4"/>
    <text x="1020" y="438" font-size="13.5" font-weight="700" fill="#1F2329" text-anchor="middle">console</text>
    <text x="1020" y="458" font-size="11.5" fill="#4E5969" text-anchor="middle">控制台</text>
    <text x="1020" y="482" font-size="11" fill="#86909C" text-anchor="middle">dock 面板与独立窗口</text>
    <text x="1020" y="502" font-size="11" fill="#86909C" text-anchor="middle">共用同一组件</text>

    <rect x="1160" y="410" width="200" height="162" rx="8" fill="#FFFFFF" stroke="#1664FF" stroke-width="1.4"/>
    <text x="1260" y="438" font-size="13.5" font-weight="700" fill="#1F2329" text-anchor="middle">json_editor</text>
    <text x="1260" y="458" font-size="11.5" fill="#4E5969" text-anchor="middle">JSON 编辑器</text>
    <text x="1260" y="482" font-size="11" fill="#86909C" text-anchor="middle">严格校验 · 折叠高亮</text>

    <rect x="1400" y="410" width="200" height="162" rx="8" fill="#FFFFFF" stroke="#1664FF" stroke-width="1.4"/>
    <text x="1500" y="438" font-size="13.5" font-weight="700" fill="#1F2329" text-anchor="middle">pin / color_picker</text>
    <text x="1500" y="458" font-size="11.5" fill="#4E5969" text-anchor="middle">便签 · 取色</text>
    <text x="1500" y="482" font-size="11" fill="#86909C" text-anchor="middle">剪贴板固定 · 屏幕取色</text>
  </g>

  <!-- ===== L4 执行层（y 652..792）===== -->
  <g>
    <rect x="200" y="652" width="440" height="140" rx="10" fill="#E6F8F5" stroke="#14B8A6" stroke-width="1.8"/>
    <text x="420" y="682" font-size="14.5" font-weight="700" fill="#0E8A7C" text-anchor="middle">RunService · 脚本执行</text>
    <text x="420" y="708" font-size="11.5" fill="#4E5969" text-anchor="middle">任务队列 · 取消 · 状态广播</text>
    <text x="420" y="730" font-size="11.5" fill="#4E5969" text-anchor="middle">runner：swc 类型擦除 → rquickjs（一次性 · 可中断）</text>
    <text x="420" y="752" font-size="11.5" fill="#4E5969" text-anchor="middle">宿主模块注入 bolt / typer / qr · 权限 fail-closed</text>
    <text x="420" y="774" font-size="11.5" fill="#4E5969" text-anchor="middle">GPUI 主线程只渲染，执行全在 worker 线程</text>

    <rect x="700" y="652" width="440" height="140" rx="10" fill="#E8F8EE" stroke="#22C55E" stroke-width="1.8"/>
    <text x="920" y="682" font-size="14.5" font-weight="700" fill="#15803D" text-anchor="middle">扩展运行时 · plux-js-manager</text>
    <text x="920" y="708" font-size="11.5" fill="#4E5969" text-anchor="middle">每扩展一条常驻 QuickJS 线程（四态就绪状态机）</text>
    <text x="920" y="730" font-size="11.5" fill="#4E5969" text-anchor="middle">manifest 解析校验 · 模块解析 loader</text>
    <text x="920" y="752" font-size="11.5" fill="#4E5969" text-anchor="middle">JsEnv 权限注入 · 拒绝项生成抛错桩</text>
    <text x="920" y="774" font-size="11.5" fill="#4E5969" text-anchor="middle">模块级状态跨命令保留</text>

    <rect x="1200" y="652" width="400" height="140" rx="10" fill="#F1ECFE" stroke="#8B5CF6" stroke-width="1.8"/>
    <text x="1400" y="682" font-size="14.5" font-weight="700" fill="#6D28D9" text-anchor="middle">gpui-shell · UI 命令渲染</text>
    <text x="1400" y="708" font-size="11.5" fill="#4E5969" text-anchor="middle">`export default class extends View`</text>
    <text x="1400" y="730" font-size="11.5" fill="#4E5969" text-anchor="middle">原生窗口渲染 · 无 WebView</text>
    <text x="1400" y="752" font-size="11.5" fill="#4E5969" text-anchor="middle">localStorage · 剪贴板 能力授予</text>
  </g>

  <!-- L3 → L4 蓝色箭头（scripts / extensions），绿色回灌（extensions） -->
  <line x1="540" y1="572" x2="540" y2="644" stroke="#1664FF" stroke-width="2.4" marker-end="url(#arr-blue)"/>
  <line x1="780" y1="572" x2="780" y2="644" stroke="#1664FF" stroke-width="2.4" marker-end="url(#arr-blue)"/>
  <line x1="740" y1="652" x2="740" y2="580" stroke="#22C55E" stroke-width="2.4" marker-end="url(#arr-green)"/>
  <g font-size="11" fill="#4E5969">
    <text x="552" y="600">运行脚本</text>
    <text x="792" y="600">扩展命令</text>
    <text x="620" y="640" fill="#15803D">目录扫描 · 热重载</text>
  </g>
  <line x1="1140" y1="722" x2="1192" y2="722" stroke="#8B5CF6" stroke-width="2.2" marker-end="url(#arr-grey)"/>
  <rect x="1152" y="690" width="64" height="22" rx="11" fill="#6D28D9"/>
  <text x="1184" y="705" font-size="10.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">UI 命令</text>

  <!-- L4 → L5 橙色 Console 轨道（三条，各自独立水平轨道） -->
  <polyline points="460,792 460,820 640,820 640,872" fill="none" stroke="#F59E0B" stroke-width="2.2" marker-end="url(#arr-orange)"/>
  <line x1="760" y1="792" x2="760" y2="872" stroke="#F59E0B" stroke-width="2.2" marker-end="url(#arr-orange)"/>
  <polyline points="1400,792 1400,846 880,846 880,872" fill="none" stroke="#F59E0B" stroke-width="2.2" marker-end="url(#arr-orange)"/>

  <!-- L4 → L5 灰虚支撑 -->
  <line x1="300" y1="792" x2="300" y2="872" stroke="#86909C" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr-grey)"/>
  <line x1="1450" y1="792" x2="1450" y2="872" stroke="#86909C" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr-grey)"/>

  <!-- 轨道说明标签 -->
  <g font-size="11" fill="#B45309">
    <text x="470" y="812">脚本 console / 错误</text>
    <text x="772" y="818">扩展命令输出</text>
    <text x="1080" y="838">UI 命令 console（tracing 桥接）</text>
  </g>
  <g font-size="11" fill="#86909C">
    <text x="308" y="830">脚本 I/O</text>
    <text x="1458" y="830">窗口壳</text>
  </g>

  <!-- ===== L5 基础设施（y 880..1000）===== -->
  <g>
    <rect x="200" y="880" width="320" height="120" rx="8" fill="#F7F8FA" stroke="#E5E6EB" stroke-width="1.2"/>
    <text x="360" y="908" font-size="13" font-weight="700" fill="#1F2329" text-anchor="middle">model + core</text>
    <text x="360" y="932" font-size="11" fill="#86909C" text-anchor="middle">script_store · project_gen</text>
    <text x="360" y="952" font-size="11" fill="#86909C" text-anchor="middle">smart_rank 时间衰减排序</text>
    <text x="360" y="972" font-size="11" fill="#86909C" text-anchor="middle">storage / file_storage</text>

    <rect x="590" y="880" width="340" height="120" rx="8" fill="#FEF3D6" stroke="#F59E0B" stroke-width="1.6"/>
    <text x="760" y="908" font-size="13" font-weight="700" fill="#B45309" text-anchor="middle">ConsoleChannel · 共享缓冲</text>
    <text x="760" y="932" font-size="11" fill="#86909C" text-anchor="middle">1000 条环形缓冲 · 读者自持游标 since(cursor)</text>
    <text x="760" y="952" font-size="11" fill="#86909C" text-anchor="middle">Error 同步落盘 bolt.log · 多面板并行订阅</text>

    <rect x="980" y="880" width="340" height="120" rx="8" fill="#F7F8FA" stroke="#E5E6EB" stroke-width="1.2"/>
    <text x="1150" y="908" font-size="13" font-weight="700" fill="#1F2329" text-anchor="middle">LSP · 语言服务</text>
    <text x="1150" y="932" font-size="11" fill="#86909C" text-anchor="middle">typescript-language-server 子进程</text>
    <text x="1150" y="952" font-size="11" fill="#86909C" text-anchor="middle">诊断 / 补全 / 悬停 / 跳转</text>
    <text x="1150" y="972" font-size="11" fill="#86909C" text-anchor="middle">阻塞线程 + background_spawn，无 tokio</text>

    <rect x="1330" y="880" width="280" height="120" rx="8" fill="#F7F8FA" stroke="#E5E6EB" stroke-width="1.2"/>
    <text x="1470" y="908" font-size="13" font-weight="700" fill="#1F2329" text-anchor="middle">ui · 共享件</text>
    <text x="1470" y="932" font-size="11" fill="#86909C" text-anchor="middle">统一窗口壳（标题栏 / 图钉 / 置顶）</text>
    <text x="1470" y="952" font-size="11" fill="#86909C" text-anchor="middle">NSPasteboard 内容识别</text>
    <text x="1470" y="972" font-size="11" fill="#86909C" text-anchor="middle">纯文本编辑操作</text>
  </g>

  <!-- ===== 底部注释 ===== -->
  <text x="60" y="1030" font-size="11.5" fill="#86909C">依赖方向自上而下单向：模块实现 Module trait 向 Launcher 贡献 items，执行层与基础设施对上不可见；扩展运行时独立成 crate（plux-js-manager），不依赖 gpui，可单独测试。</text>
</svg>
