[package]
name = "scripter"
version = "0.1.0"
edition = "2024"

[dependencies]
# gpui-kit = "0.7"
gpui-kit = { version = "0.7.1", features = [
	"tree-sitter-javascript",
	"tree-sitter-typescript",
] }
parking_lot = "0.12"
dirs = "5"
thiserror = "2"
crossbeam-channel = "0.5"
rquickjs = { version = "0.14.0", features = [
	"loader",
	"macro",
	"bindgen",
	"futures",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1"
lsp-types = "0.97"
reqwest = { version = "0.13.5", default-features = false, features = [
	"rustls",
] }
tokio = { version = "1.53.2", features = [
	"rt-multi-thread",
	"process",
	"macros",
] }
futures = "0.3.34"
# Host interaction APIs (`typeStr` / `scanQr`).
# typeStr uses enigo for cross-platform keyboard simulation.
# scanQr needs CoreGraphics for the screen-capture permission check.
enigo = "0.6"
core-graphics = "0.24"
xcap = { version = "0.9", default-features = false, features = ["image"] }
rqrr = "0.11"
image = { version = "0.25", default-features = false }
swc_ecma_parser = "46.0.0"
swc_ecma_transforms_typescript = "56.0.0"
swc_common = "26.0.0"
swc_ecma_codegen = "32.0.3"
swc_ecma_transforms_base = "50.0.0"
swc_ecma_ast = "29.0.2"
