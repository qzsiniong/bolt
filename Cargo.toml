[package]
name = "scripter"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = "0.7"
parking_lot = "0.12"
dirs = "5"
thiserror = "2"
crossbeam-channel = "0.5"
rquickjs = { version = "0.14.0", features = [
	"loader",
	"macro",
	"bindgen",
	"futures",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1"
lsp-types = "0.97"
reqwest = { version = "0.13.5", default-features = false, features = [
	"rustls",
] }
tokio = { version = "1.53.2", features = [
	"rt-multi-thread",
	"process",
	"macros",
] }
futures = "0.3.34"
swc_ecma_parser = "46.0.0"
swc_ecma_transforms_typescript = "56.0.0"
swc_common = "26.0.0"
swc_ecma_codegen = "32.0.3"
swc_ecma_transforms_base = "50.0.0"
swc_ecma_ast = "29.0.2"
