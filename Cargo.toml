[package]
name = "bolt"
version = "0.2.0"
edition = "2024"

# 扩展运行时独立成 crate，与宿主解耦：它不依赖 gpui / bolt 的任何类型，
# 宿主通过 `JsEnv` 注入 console、宿主模块与交互 API。`[patch]` 与 `[profile]`
# 只在 workspace 根生效，所以都留在本文件。
#
# 其余 crate 同理，按「能否脱离 gpui 独立编译」切分：
# - bolt-console：进程级共享的 Console 输出通道
# - bolt-ts：swc 的 TypeScript 类型擦除
# - bolt-lsp：typescript-language-server 的 stdio JSON-RPC 客户端
# - bolt-model：脚本领域类型与脚本目录文件操作
# - bolt-extensions：通用 JS 扩展运行时（注册表 + 清单解析 + QuickJS 引擎）
[workspace]
members = [
	".",
	"crates/bolt-extensions",
	"crates/bolt-console",
	"crates/bolt-ts",
	"crates/bolt-lsp",
	"crates/bolt-model",
]
resolver = "3"

[dependencies]
# gpui-kit = "0.7"
gpui-kit = { version = "0.7.1", features = [
    "tree-sitter",      # 聚合，包含 tree-sitter + tree-sitter-json
    "tree-sitter-javascript",
    "tree-sitter-typescript",
] }
parking_lot = "0.12"
dirs = "5"
thiserror = "2"
crossbeam-channel = "0.5"
# 0.14 → 0.12：由下面的 [patch.crates-io] 指向 gpui-kit 的 `rquickjs` 兼容
# facade（它 `pub use quickjs_jit::*`），让脚本引擎与 gpui-shell 的扩展运行时
# 共用同一个 QuickJS，避免两套 QuickJS C 静态库的重复符号冲突。
#
# ⚠️ 不要开 `bindgen` feature：它会传染到 quickjs-jit-sys（feature 统一），
# 让所有平台改为「libclang 编译时现场生成绑定」。macOS 上恰好生成 u32 枚举
# 所以能过；Windows 的 MSVC 把 C 枚举生成为 i32，与 quickjs-jit-runtime 按
# u32 写死的用法冲突，97 个 E0308/E0425 直接编译失败。默认的预生成绑定
# （sys/src/bindings/）各平台都是 u32 且常量齐全，不开发行版 bindgen。
rquickjs = { version = "0.12", features = [
	"loader",
	"macro",
	"futures",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
semver = "1"
anyhow = "1"
lsp-types = "0.97"
reqwest = { version = "0.13.5", default-features = false, features = [
	"rustls",
] }
tokio = { version = "1.53.2", features = [
	"rt-multi-thread",
	"process",
	"macros",
] }
futures = "0.3.34"
global-hotkey = "0.8"
# Host interaction APIs (`typeStr` / `scanQr`).
# typeStr uses enigo for cross-platform keyboard simulation.
# scanQr needs CoreGraphics for the screen-capture permission check.
enigo = "0.6"
xcap = { version = "0.9", default-features = false, features = ["image"] }
rqrr = "0.11"
image = { version = "0.25", default-features = false }
# UI 扩展运行时（扩展脚本描述界面，宿主在 GPUI 主线程原生渲染，无 WebView）。
# 锁 tag：`gpui-component` 是旧仓库名，canonical 名是 `gpui-kit`，
# git 源 URL 必须与下面两个 [patch] 的 key 完全一致。
gpui-shell = { git = "https://github.com/longbridge/gpui-kit", tag = "v0.7.3", default-features = false, features = [
	"quickjs",
] }
# 宿主自己的独立组件（见上面 workspace 注释的切分说明）。
bolt-console = { path = "crates/bolt-console" }
bolt-ts = { path = "crates/bolt-ts" }
bolt-lsp = { path = "crates/bolt-lsp" }
bolt-model = { path = "crates/bolt-model" }
bolt-extensions = { path = "crates/bolt-extensions" }
# gpui-shell 通过 tracing 上报脚本 console 输出、加载失败与热重载结果；
# 不装 subscriber 这些事件会被静默丢弃（见 src/app/shell_log.rs）。
tracing = "0.1"
chrono = "0.4.45"
# Launcher 搜索的汉语拼音派生：含汉字的关键词/标题自动追加全拼与首字母
# （「微信」→ weixin + wx），让拼音输入也能命中。
pinyin = { version = "0.10", features = ["plain"] }

[dev-dependencies]
# 让单元测试能用 gpui 的 headless 测试平台跑 gpui-shell 的 `check`：真实加载
# `ui-demo` 的入口脚本并物化一次元素，捕获 JS 侧的拼写/API 错误。
#
# 只开 gpui 自己的 test-support（gpui-kit 的 test-support 会连带解析它那个
# 未发布的可选 gpui-fast-platform 依赖）。类型仍经 gpui-kit 再导出使用。
gpui-pre = { version = "=0.3.9", features = ["test-support"] }

# gpui-shell 的 `rquickjs` compat facade 在 crates.io 上名为 `rquickjs`（publish = false），
# 让全图只剩一份 QuickJS（quickjs-jit）。`[patch]` 只在根 manifest 生效，所以写在这里。
[patch.crates-io]
rquickjs = { git = "https://github.com/longbridge/gpui-kit", tag = "v0.7.3" }

# gpui-shell 的 gpui-base 是仓库内 path 依赖；改道到 registry 版，避免与
# gpui-kit 依赖的 gpui-base 变成两份不同 crate（主题/类型会分裂）。
# gpui-fps 未发布到 crates.io，保持 git 源，无害。
[patch."https://github.com/longbridge/gpui-kit"]
gpui-base = "0.7.3"

# 扩展窗口的置顶切换直接改 NSWindow 层级（`WindowKind::Floating` 与 `Normal`
# 在 gpui-pre-macos 里只差一个 `setLevel_`，运行时可调，无需关窗重开）；
# 经 `Window: HasWindowHandle` 拿 NSView 后用 objc2 发消息。版本对齐
# gpui-pre-macos 的 objc2 0.6，避免两份运行时。
#
# Pin 模块的剪切板读取同样直接发原始 Objective-C 消息（NSPasteboard / NSString /
# NSData），不引入 `objc2-app-kit` / `objc2-foundation`——它们目前依赖 objc2 0.5，
# 与本项目的 0.6 会同时进入依赖图，`msg_send!` 的 `MessageReceiver` 校验因此失败。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
raw-window-handle = "0.6"
# 显示器枚举 / 光标所在屏 / 截屏权限探测（取色器、二维码截屏、通知卡片的定位）。
core-graphics = "0.24"

# Windows 侧的平台实现（见 `src/platform/windows.rs`）。按 API 域最小开特性：
# Shell（ShellExecuteW / 废纸篓）、窗口消息（HWND 前后台）、GDI（显示器与光标）。
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
	"Win32_Foundation",
	"Win32_Graphics_Gdi",
	"Win32_UI_Shell",
	"Win32_UI_WindowsAndMessaging",
] }
# 默认程序打开路径（ShellExecute 语义）与系统回收站（IFileOperation）。
open = "5"
trash = "5"
# 文本 / 图片剪贴板。macOS 侧不用它：它依赖 objc2-app-kit（objc2 0.5），会与
# 我们直接用的 objc2 0.6 打架，所以 macOS 走 `ui/mac_ffi.rs` 的原始消息。
arboard = "3"

# quickjs-jit 的 JIT 在 opt-level = 0 下慢约 3 倍（上游建议）。
[profile.dev.package.quickjs-jit-sys]
opt-level = 3
[profile.dev.package.quickjs-jit-runtime]
opt-level = 3

# LLRT / QuickJS 的 C 代码让 __eh_frame 超过 16MB，链接器每次会提示
# "section too large ... performance of exception handling might be affected"。
# 这是既有第三方代码的固有提示（同一链接里其它 ld 告警/错误仍会照常出现），
# 这里只关掉这条噪音。
[lints.rust]
linker_messages = "allow"
